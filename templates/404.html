{{define "content"}}
<main class="pt-16 flex-1 grid place-items-center">
    <div class="max-w-lg mx-auto px-6 py-24 text-center">
        <p class="font-mono text-6xl font-bold text-slate-700 mb-6">404</p>
        <h1 class="font-heading text-3xl font-bold text-white mb-3">That page does not exist</h1>
        <p class="text-slate-400 leading-relaxed mb-8">
            It may have moved when the site was rebuilt.
        </p>
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            {{template "ui/button" dict "Label" "All steps" "Href" "/steps"}}
            {{template "ui/button" dict "Label" "Home" "Href" "/" "Variant" "secondary"}}
        </div>
    </div>
</main>
{{end}}
